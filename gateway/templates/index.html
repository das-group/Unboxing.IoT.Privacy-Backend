<!DOCTYPE html>
<html>

<body>
  <label for="entry_id">Entry ID</label>
  <input type="text" style="width: 50%;" id="entry_id">
  <br><br>
  <h3>Chunk → Proxy → Destination: Net</h3>
  <input type="file" id="file_net">
  <label for="net_mac">MAC Address</label>
  <input type="text" id="net_mac">
  <button onclick="upload('net')">Upload</button>
  <br><br>
    <br><br>
  <h3>Chunk → Proxy → Destination: Policy</h3>
  <input type="file" id="file_policy">
  <button onclick="upload('policy')">Upload</button>
  <br><br>
  <h3>Image Upload for Entry ID</span></h3>
  <label for="image">Image</label>
  <input type="file" id="image">
  <button onclick="uploadImage()">Upload</button>
  <br><br>

  <script>

    const destinationUrlNet = "/upload/net/chunk";
    const destinationUrlPolicy = "/upload/policy/chunk";
    const destinationUrlImage = "/upload/image";


    async function upload(type) {
      const entryId = document.getElementById("entry_id").value;
      const fileElementID = type === 'net' ? "file_net" : "file_policy";
      const file = document.getElementById(fileElementID).files[0];
      const destinationUrl = type === 'net' ? destinationUrlNet : destinationUrlPolicy;

      const uploadId = await getUploadID(entryId);
      if (uploadId == null) {
        console.log("Upload ID is null, aborting upload.");
        return;
      }

      const sucess = await uploadChunks(file, destinationUrl, uploadId);

      if (!sucess) {
        console.log("Upload failed during chunk upload.");
        return;
      }

      const completeResponse = await fetch(`/upload/${type}/complete`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          upload_id: uploadId,
          mac_address: document.getElementById("net_mac").value
        })
      });

      if (!completeResponse.ok) {
        console.log("Failed to complete upload. Server responded with status:", completeResponse.status);
        return;
      }

      console.log("Upload completed successfully.");
    }

    async function getUploadID(entryId) {
      // Get upload ID from server
      const uploadIdResponse = await fetch(`/upload-id/${entryId}`);
      if (!uploadIdResponse.ok) {
        console.log("Failed to get upload ID. Server responded with status:", uploadIdResponse.status);
        return null;
      }
      const uploadIdData = await uploadIdResponse.json();
      return uploadIdData.upload_id;
    }

    async function uploadChunks(file, destinationUrl, uploadId) {
      
      // Prepare for chunked upload
      const fileType = file.name.split('.').pop();
      const chunkSize = 1024 * 1024 * 10; // 10MB
      const totalChunks = Math.ceil(file.size / chunkSize);

      // Upload each chunk
      for (let i = 0; i < totalChunks; i++) {
        const chunk = file.slice(i * chunkSize, (i + 1) * chunkSize);

        const form = new FormData();
        form.append("upload_id", uploadId);
        form.append("chunk_index", i);
        form.append("total_chunks", totalChunks);
        form.append("chunk", chunk);
        form.append("file_type", fileType);

        console.log(`Uploading chunk ${i + 1}/${totalChunks}`);

        const result = await fetch(destinationUrl, {
          method: "POST",
          body: form
        });

        if (!result.ok) {
          console.log(`Failed to upload chunk ${i + 1}`);
          return false;
        }

      }
      console.log(`Successfully uploaded all ${totalChunks} chunks`);
      return true;
}

    async function uploadImage() {
      const entryId = document.getElementById("entry_id").value;
      const file = document.getElementById("image").files[0];

      const form = new FormData();
      form.append("file_upload", file);

      const result = await fetch(`${destinationUrlImage}/${entryId}`, {
        method: "POST",
        body: form
      });

      if (!result.ok) {
        console.log("Failed to upload image");
        return;
      }

      json = await result.json();
      console.log(json);
    }


  </script>
</body>

</html>
